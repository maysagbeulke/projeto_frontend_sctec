<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro de Alunos - AVA-EDUCA+</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="./cadastro-aluno.css">

    <!-- Biblioteca Moment.js para validar datas -->
    <script src="https://cdn.jsdelivr.net/npm/moment@2.30.1/moment.min.js"></script>
</head>

<body>

    <div class="layout">

        <!-- menu lateral -->
        <aside class="sidebar">

            <h2>AVA-EDUCA+</h2>

            <nav>
                <ul>
                   <li id="btnDashboard">Dashboard</li>
                    <li>Cursos</li>
                    <li>Cadastro de Alunos</li>
                    <li id="btnSair">Sair</li>
                </ul>
            </nav>

        </aside>

        <div class="main-content">

            <!-- Cabeçalho -->
            <header class="header">

                <h1>Cadastro de Alunos</h1>

                <span id="usuarioLogado">Usuário</span>

            </header>

            <main class="content">

                <h2>Cadastrar novo aluno</h2>

                <!-- formulario  cadastro -->
                <form id="formCadastroAluno">

                    <label for="nome">Nome Completo:</label>
                    <input type="text" id="nome" required>


                    <label for="genero">Gênero:</label>
                    <select id="genero" required>
                        <option value="">Selecione</option>
                        <option value="Feminino">Feminino</option>
                        <option value="Masculino">Masculino</option>
                        <option value="Outro">Outro</option>
                    </select>


                    <label for="dataNascimento">Data de Nascimento:</label>
                    <input
                        type="text"
                        id="dataNascimento"
                        placeholder="DD/MM/AAAA"
                        required
                    >


                    <label for="cpf">CPF:</label>
                    <input type="text" id="cpf" required>


                    <label for="telefone">Telefone:</label>
                    <input type="text" id="telefone" required>


                    <label for="email">E-mail:</label>
                    <input type="email" id="email" required>


                    <h3>Endereço</h3>


                    <label for="cep">CEP:</label>
                    <input type="text" id="cep" required>


                    <label for="cidade">Cidade:</label>
                    <input type="text" id="cidade" required>


                    <label for="estado">Estado:</label>
                    <input type="text" id="estado" required>


                    <label for="logradouro">Logradouro:</label>
                    <input type="text" id="logradouro" required>


                    <label for="numero">Número:</label>
                    <input type="text" id="numero" required>


                    <label for="complemento">Complemento:</label>
                    <input type="text" id="complemento">


                    <label for="bairro">Bairro:</label>
                    <input type="text" id="bairro" required>


                    <button type="submit">Cadastrar Aluno</button>

                    <p id="mensagem"></p>

                </form>

            </main>

        </div>

    </div>

    <script type="module" src="./cadastro-aluno.js"></script>

</body>

</html>
